[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["store.config.json", "db.js"]

[[redirects]]
  from = "/_serverFn/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

